<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Klimt</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="app.css" />
  <link id="theme-css" rel="stylesheet" href="themes/editorial.css" />
  <script>(function(){var t=new URLSearchParams(location.search).get("theme");if(t&&/^[A-Za-z0-9_-]+$/.test(t))document.getElementById("theme-css").href="themes/"+t+".css";})();</script>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.10.0/highlight.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.6.0/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      flowchart: {
        htmlLabels: false,
      },
      themeVariables: {
        background: "#150a00",
        primaryColor: "#2a1800",
        primaryTextColor: "#ffc94d",
        primaryBorderColor: "#ffc94d",
        lineColor: "#ffc94d",
        secondaryColor: "#3a2400",
        tertiaryColor: "#150a00",
        fontFamily: "IBM Plex Mono, Berkeley Mono, Menlo, monospace",
        fontSize: "11px",
      },
    });
    window.mermaid = mermaid;
  </script>
</head>
<body>
  <header id="topbar">
    <span id="title" aria-label="klimt"><span class="logo-bracket">[</span><span class="logo-core">|&lt;</span><span class="logo-bracket">]</span></span>
    <nav id="tabs" aria-label="tabs"></nav>
    <button id="new-tab" type="button" title="new tab (Ctrl+T)">+</button>
  </header>

  <div id="transcripts"></div>

  <footer id="composer">
    <textarea
      id="input"
      rows="1"
      autocorrect="off"
      autocomplete="on"
      autocapitalize="off"
      spellcheck="false"
    ></textarea>
  </footer>

  <section id="active-status" aria-live="polite">
    <span id="model" class="muted"></span>
    <span id="cwd" class="muted cwd"></span>
    <span id="context" class="muted context"></span>
    <span id="status" class="muted status"></span>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
