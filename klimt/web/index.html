<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Klimt</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        background: "#2a1700",
        primaryColor: "#2a1800",
        primaryTextColor: "#ffb000",
        primaryBorderColor: "#ffb000",
        lineColor: "#ffb000",
        secondaryColor: "#3a2400",
        tertiaryColor: "#2a1700",
        fontFamily: "inherit",
      },
    });
    window.mermaid = mermaid;
  </script>
</head>
<body>
  <header id="topbar">
    <span id="title">Klimt</span>
    <span id="model" class="muted"></span>
    <button id="reset" title="Clear conversation">reset</button>
  </header>

  <main id="transcript" aria-live="polite"></main>

  <footer id="composer">
    <textarea id="input" rows="3" placeholder="Message. Enter=send, Shift+Enter=newline, !cmd=shell, /name=skill"></textarea>
    <button id="send">send</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
