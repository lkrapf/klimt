<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Klimt</title>
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="style.css" />

  <script src="vendor/marked/marked.min.js"></script>
  <script src="vendor/dompurify/purify.min.js"></script>
  <script src="vendor/highlight/highlight.min.js"></script>
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="vendor/mermaid/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      themeVariables: {
        background: "#150a00",
        primaryColor: "#2a1800",
        primaryTextColor: "#ffc94d",
        primaryBorderColor: "#ffc94d",
        lineColor: "#ffc94d",
        secondaryColor: "#3a2400",
        tertiaryColor: "#150a00",
        fontFamily: "inherit",
      },
    });
  </script>
</head>
<body>
  <header id="topbar">
    <span id="title" aria-label="klimt">[|&lt;]</span>
    <nav id="tabs" aria-label="tabs"></nav>
    <button id="new-tab" type="button" title="new tab (Ctrl+T)">+</button>
  </header>

  <div id="transcripts"></div>

  <footer id="composer">
    <textarea id="input" rows="1"></textarea>
  </footer>

  <section id="active-status" aria-live="polite">
    <span id="model" class="muted"></span>
    <span id="context" class="muted context"></span>
    <span id="status" class="muted status"></span>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
