[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "klimt"
version = "0.2.1"
description = "Small local LLM harness with a pywebview UI, streaming Markdown, sessions, skills, and tools."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35.0",
  "openai>=1.50.0",
  "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
klimt = "klimt.app:main"

[tool.setuptools.packages.find]
include = ["klimt*"]

[tool.setuptools.package-data]
klimt = [
  "KERNEL.md",
  "web/*",
  "assets/*",
  "assets/klimt-icon.iconset/*",
]
